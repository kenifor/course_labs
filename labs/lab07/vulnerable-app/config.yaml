app:
  name: "lab07-secure-app"
  environment: "production"
  # Fix: Disable debug mode
  debug: false
  # Fix: Disable verbose logging
  verbose_logging: false

server:
  # Fix: Bind to localhost instead of 0.0.0.0
  host: "127.0.0.1"
  port: 8080
  enable_metrics: true
  # Fix: Specify allowed origins instead of wildcard
  allow_origin: "https://example.com"

database:
  engine: "sqlite"
  host: "localhost"
  port: 5432
  name: "vuln_db"
  # Fix: Remove hardcoded credentials - use environment variables
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  pool_size: 20
  # Fix: Disable query debugging
  debug_queries: false

security:
  allow_registration: false
  # Fix: Remove hardcoded admin credentials
  default_admin_user: "${ADMIN_USER}"
  default_admin_password: "${ADMIN_PASSWORD}"
  # Fix: Use strong JWT secret from environment
  jwt_secret: "${JWT_SECRET}"
  jwt_algorithm: "HS256"
  # Fix: Enable CSRF protection
  enable_csrf_protection: true
  # Fix: Enable rate limiting
  enable_rate_limit: true
  # Fix: Disable insecure cookies
  allow_insecure_cookies: false
  # Fix: Enable secure session cookies
  session_cookie_secure: true
  session_cookie_httponly: true

logging:
  # Fix: Set logging level to INFO
  level: "INFO"
  log_sql: false
  # Fix: Disable logging of sensitive data (and fix syntax error)
  log_sensitive_data: false
  log_file: "app.log"

features:
  # Fix: Disable experimental API
  enable_experimental_api: false
  # Fix: Disable unsafe eval
  enable_unsafe_eval: false
  # Fix: Disable remote shell
  enable_remote_shell: false

integrations:
  debug_webhook_url: ""
  # Fix: Disable unsafe webhooks
  enable_unsafe_webhooks: false
  # Fix: Restrict trusted proxies
  trusted_proxies:
    - "127.0.0.1"
