version: "3.9"
services:
  vulnerable-app:
    build: ./vulnerable-app
    ports:
      - "127.0.0.1:8080:8080"  # Fix: Bind to localhost only
    # Fix: Use environment file instead of hardcoded secrets
    env_file:
      - .env
    # Fix: Add resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # Fix: Add restart policy
    restart: unless-stopped
