version: '3.8'

services:
  web:
    image: nginx:1.25-alpine
    user: nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vulnapp
      POSTGRES_USER: vulnuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - dbdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    image: python:3.11-alpine
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./app:/app:ro
    environment:
      DEBUG: "false"
    depends_on:
      - db
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  dbdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
